<h2 class="page-title">{{ 'CUSTOMER.EDIT_TITLE' | translate }} #{{ musteriId }}</h2>

<div class="form-container" *ngIf="!loading">
    <div class="form-left">
        <div class="form-row-double">
            <div class="form-col">
                <label class="form-label">{{ 'CUSTOMER.FIRST_NAME' | translate }}</label>
                <input type="text" class="form-control" [(ngModel)]="ad">
            </div>
            <div class="form-col" *ngIf="musteriTipi === 1">
                <label class="form-label">{{ 'CUSTOMER.LAST_NAME' | translate }}</label>
                <input type="text" class="form-control" [(ngModel)]="soyad">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">{{ (musteriTipi === 1 ? 'CUSTOMER.TCKN' : 'CUSTOMER.VKN') | translate }}</label>
            <input type="text" class="form-control" [(ngModel)]="kimlikNo">
        </div>

        <div class="form-group">
            <label class="form-label">{{ 'COMMON.STATUS' | translate }}</label>
            <select class="form-control" [(ngModel)]="aktifMi">
                <option [ngValue]="1">{{ 'COMMON.ACTIVE' | translate }}</option>
                <option [ngValue]="2">{{ 'COMMON.PASSIVE' | translate }}</option>
            </select>
        </div>
    </div>

    <div class="form-right">
        <div class="form-group">
            <label class="form-label">{{ 'CUSTOMER.EMAIL' | translate }}</label>
            <input type="email" class="form-control" [(ngModel)]="email">
        </div>

        <div class="form-group">
            <label class="form-label">{{ 'CUSTOMER.PHONE' | translate }}</label>
            <input type="tel" class="form-control" [(ngModel)]="telefon">
        </div>

        <div class="form-actions">
            <button class="btn-cancel" (click)="iptal()">{{ 'COMMON.CANCEL' | translate }}</button>
            <button class="btn-submit" (click)="guncelle()">{{ 'COMMON.SAVE' | translate }}</button>
        </div>
    </div>
</div>

<div *ngIf="loading" class="loading-container">
    <p>{{ 'COMMON.LOADING' | translate }}</p>
</div>
